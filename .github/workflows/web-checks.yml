name: Web app checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-speak-with-john-adams
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-speak-with-john-adams/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
